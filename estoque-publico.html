<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ZOLPAM - ESTOQUE GG'S</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{min-height:100vh;background:#070b14;color:#e2e8f0;font-family:'DM Mono','Courier New',monospace;}
  ::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:#1e2d4a;border-radius:4px}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .fu{animation:fadeUp 0.25s ease forwards;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
  .pulse{animation:pulse 2s infinite;}

  .header{
    text-align:center;
    padding:40px 24px 28px;
    border-bottom:1px solid #131d2e;
    background:linear-gradient(180deg,#0d1426 0%,#070b14 100%);
  }
  .header-title{
    font-family:'Syne',sans-serif;
    font-weight:800;
    font-size:28px;
    letter-spacing:-0.5px;
    margin-bottom:6px;
  }
  .header-sub{font-size:13px;color:#3a5070;margin-bottom:16px;}
  .live-badge{
    display:inline-flex;align-items:center;gap:7px;
    background:#052e16;border:1px solid #16a34a55;
    border-radius:20px;padding:6px 16px;
    font-size:12px;color:#4ade80;letter-spacing:1.5px;
    margin-bottom:6px;
  }
  .live-dot{width:8px;height:8px;background:#4ade80;border-radius:50%;}
  .update-time{font-size:11px;color:#1e3050;}

  .controls{
    display:flex;align-items:center;justify-content:center;gap:8px;
    padding:20px 24px;
    flex-wrap:wrap;
  }
  .count-text{font-size:14px;color:#475569;margin-right:8px;}
  .sort-btn{
    background:#0d1626;border:1px solid #1e2d4a;
    color:#475569;border-radius:10px;
    padding:10px 20px;font-size:13px;
    cursor:pointer;font-family:inherit;
    transition:all 0.15s;
  }
  .sort-btn.active{
    background:rgba(37,99,235,0.15);
    border-color:#2563eb;color:#60a5fa;
  }
  .sort-btn:hover{border-color:#2563eb55;color:#94a3b8;}

  .divider{
    width:60px;height:1px;
    background:linear-gradient(90deg,transparent,#1e2d4a,transparent);
    margin:0 auto 24px;
  }

  .cards-grid{
    max-width:860px;
    margin:0 auto;
    padding:0 20px 60px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .card{
    background:#0d1626;
    border:1px solid #131d2e;
    border-radius:16px;
    padding:20px 28px;
    display:grid;
    grid-template-columns:1fr 1fr 1fr 1.3fr;
    align-items:center;
    gap:16px;
    transition:border-color 0.15s, transform 0.1s;
  }
  .card:hover{border-color:#1e3050;transform:translateY(-1px);}

  .card-label{
    font-size:11px;color:#64748b;
    letter-spacing:2px;margin-bottom:6px;
  }
  .card-value{font-size:17px;font-weight:500;color:#cbd5e1;}
  .card-value.bin{font-size:19px;color:#f1f5f9;font-family:monospace;font-weight:600;}
  .card-value.disp{font-size:22px;font-weight:700;}

  .empty{
    text-align:center;padding:80px 24px;
    color:#1e2d3a;font-size:15px;line-height:2.2;
  }

  .footer{
    text-align:center;padding:24px;
    font-size:12px;color:#1e2d3a;
    border-top:1px solid #0a1020;
  }

  @media(max-width:600px){
    .header-title{font-size:22px;}
    .card{
      grid-template-columns:1fr 1fr;
      gap:14px;
      padding:16px 18px;
    }
    .card-value.disp{font-size:18px;}
    .controls{padding:14px 16px;}
  }

  /* CONTACT MODAL */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px);}
  .modal-overlay.hide{display:none;}
  .contact-modal{background:#0d1626;border:1px solid #1e2d4a;border-radius:20px;padding:36px 32px;max-width:360px;width:100%;text-align:center;}
  .contact-btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;border:none;border-radius:14px;padding:16px 20px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;transition:all 0.15s;text-decoration:none;}
  .contact-btn:hover{transform:translateY(-2px);filter:brightness(1.1);}
  .contact-btn.whatsapp{background:#075e54;color:#25d366;}
  .contact-btn.telegram{background:#0a2540;color:#2aabee;}
  .buy-btn{background:transparent;border:1px solid #1e3050;color:#60a5fa;border-radius:10px;padding:9px 18px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all 0.15s;margin-top:12px;width:100%;}
  .buy-btn:hover{background:rgba(37,99,235,0.15);border-color:#2563eb;}
</style>
</head>
<body>

<div class="header">
  <div class="header-title">ZOLPAM <span style="color:#7c3aed;">·</span> ESTOQUE GG'S</div>
  <div class="header-sub">Cartões disponíveis para venda</div>
  <div class="live-badge">
    <div class="live-dot pulse"></div>
    AO VIVO
  </div>
  <div class="update-time" id="last-update"></div>
</div>

<div class="controls">
  <span class="count-text"><span id="total-count">0</span> cartões disponíveis</span>
  <button class="sort-btn" id="btn-default" onclick="setSort('default')">↕ Padrão</button>
  <button class="sort-btn active" id="btn-asc" onclick="setSort('asc')">↑ Menor limite</button>
  <button class="sort-btn" id="btn-desc" onclick="setSort('desc')">↓ Maior limite</button>
</div>

<div class="divider"></div>

<div class="cards-grid" id="lista"></div>


<!-- CONTACT MODAL -->
<div class="modal-overlay hide" id="contact-modal" onclick="if(event.target===this)fecharModal()">
  <div class="contact-modal">
    <div style="font-size:32px;margin-bottom:10px;">🛒</div>
    <div style="font-family:'Syne',sans-serif;font-weight:800;font-size:20px;margin-bottom:6px;">Comprar cartão</div>
    <div id="modal-info" style="font-size:13px;color:#475569;margin-bottom:28px;line-height:1.6;"></div>
    <div style="display:flex;flex-direction:column;gap:12px;">
      <a id="btn-whatsapp" href="#" target="_blank" class="contact-btn whatsapp">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="#25d366"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.127.558 4.126 1.528 5.855L.057 23.428a.75.75 0 0 0 .915.916l5.63-1.463A11.945 11.945 0 0 0 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-1.869 0-3.628-.487-5.153-1.342l-.369-.214-3.827.994.997-3.757-.234-.384A9.96 9.96 0 0 1 2 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/></svg>
        WhatsApp
      </a>
      <a id="btn-telegram" href="#" target="_blank" class="contact-btn telegram">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="#2aabee"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
        Telegram
      </a>
    </div>
    <button onclick="fecharModal()" style="margin-top:20px;background:transparent;border:none;color:#2a3a55;font-size:13px;cursor:pointer;font-family:inherit;">← Voltar</button>
  </div>
</div>

<div class="footer">
  Atualizado automaticamente em tempo real · Entre em contato para adquirir
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBKjd-EOvI94Vr0TWYDNmLw9kBsSeUmUY4",
  authDomain: "zolpamcred.firebaseapp.com",
  projectId: "zolpamcred",
  storageBucket: "zolpamcred.firebasestorage.app",
  messagingSenderId: "672941533814",
  appId: "1:672941533814:web:b14fe1127311c0c5e70d57"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

const RANGES = [
  {min:0,    max:1000,   color:"#94a3b8"},
  {min:1000, max:1500,   color:"#60a5fa"},
  {min:1500, max:2000,   color:"#34d399"},
  {min:2000, max:2500,   color:"#a78bfa"},
  {min:2500, max:3000,   color:"#f472b6"},
  {min:3000, max:4000,   color:"#fb923c"},
  {min:4000, max:5000,   color:"#facc15"},
  {min:5000, max:7500,   color:"#f87171"},
  {min:7500, max:10000,  color:"#2dd4bf"},
  {min:10000,max:Infinity,color:"#e879f9"},
];

function getColor(v){ return (RANGES.find(r=>v>=r.min&&v<r.max)||RANGES[RANGES.length-1]).color; }
function fmt(n){ if(isNaN(n)||n==null)return'—'; return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function getBin(n){ return (n||'').replace(/\D/g,'').substring(0,6)||'—'; }
function valStyle(v){
  if(!v||v==='—')return{color:'#2a3a55',label:'—'};
  const p=v.replace('|','/').split('/');
  if(p.length<2)return{color:'#2a3a55',label:v};
  const venc=new Date(parseInt(p[1].length===2?'20'+p[1]:p[1]),parseInt(p[0]),1);
  const diff=(venc-new Date())/(1000*60*60*24*30);
  if(diff<=1)return{color:'#f87171',label:v+' ⚠'};
  if(diff<=3)return{color:'#facc15',label:v+' ⚡'};
  return{color:'#cbd5e1',label:v};
}

let cards=[];
let sortMode='asc';

window.setSort=function(mode){
  sortMode=mode;
  ['default','asc','desc'].forEach(m=>{
    document.getElementById('btn-'+m).classList.toggle('active',m===mode);
  });
  render();
};

function render(){
  let list=[...cards];
  if(sortMode==='asc') list.sort((a,b)=>{const va=isNaN(a.limiteDisp)?a.limiteTotal:a.limiteDisp;const vb=isNaN(b.limiteDisp)?b.limiteTotal:b.limiteDisp;return va-vb;});
  else if(sortMode==='desc') list.sort((a,b)=>{const va=isNaN(a.limiteDisp)?a.limiteTotal:a.limiteDisp;const vb=isNaN(b.limiteDisp)?b.limiteTotal:b.limiteDisp;return vb-va;});

  document.getElementById('total-count').textContent=list.length;
  const cont=document.getElementById('lista');
  cont.innerHTML='';

  if(list.length===0){
    cont.innerHTML=`<div class="empty">😔 Nenhum cartão disponível no momento.<br>Volte em breve!</div>`;
    return;
  }

  list.forEach((c,i)=>{
    const lt=isNaN(c.limiteTotal)?0:c.limiteTotal;
    const ld=isNaN(c.limiteDisp)?lt:c.limiteDisp;
    const color=getColor(ld);
    const bin=getBin(c.numero);
    const vs=valStyle(c.validade);

    const card=document.createElement('div');
    card.className='card fu';
    card.style.animationDelay=(i*0.025)+'s';
    card.style.borderLeftColor=color;
    card.style.borderLeftWidth='3px';
    card.innerHTML=`
      <div>
        <div class="card-label">BIN</div>
        <div class="card-value bin">${bin}</div>
      </div>
      <div>
        <div class="card-label">VALIDADE</div>
        <div class="card-value" style="color:${vs.color};font-size:17px;font-weight:500;">${vs.label}</div>
      </div>
      <div>
        <div class="card-label">LIMITE TOTAL</div>
        <div class="card-value" style="font-size:17px;color:#cbd5e1;font-weight:500;">${fmt(lt)}</div>
      </div>
      <div>
        <div class="card-label">DISPONÍVEL</div>
        <div class="card-value disp" style="color:${color};">${fmt(ld)}</div>
      </div>
      <div style="grid-column:1/-1;margin-top:8px;">
        <button class="buy-btn" onclick="abrirModal('${bin}','${fmt(ld)}')">🛒 Quero comprar</button>
      </div>`;
    cont.appendChild(card);
  });

  document.getElementById('last-update').textContent=
    'Atualizado às '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

onSnapshot(collection(db,'estoque'),snap=>{
  cards=snap.docs.map(d=>({...d.data(),id:d.id}));
  render();
},()=>{
  document.getElementById('lista').innerHTML=
    `<div class="empty">⚠️ Erro ao carregar.<br>Tente recarregar a página.</div>`;
});

// ── CONTACT ──────────────────────────────────────────────
const WPP_NUM = '595986431149';   // ← seu número com DDI+DDD sem espaços
const TELEGRAM = 'zolpamm';         // ← seu @ do telegram sem o @

window.abrirModal = function(bin, limite){
  const txt = `Olá! Tenho interesse no cartão:\nBIN: ${bin} | Disponível: ${limite}`;
  const wpp = `https://wa.me/${WPP_NUM}?text=${encodeURIComponent(txt)}`;
  const tg  = `https://t.me/${TELEGRAM}?text=${encodeURIComponent(txt)}`;
  document.getElementById('btn-whatsapp').href = wpp;
  document.getElementById('btn-telegram').href = tg;
  document.getElementById('modal-info').innerHTML =
    `BIN: <strong style="color:#e2e8f0">${bin}</strong> &nbsp;·&nbsp; Disponível: <strong style="color:#4ade80">${limite}</strong>`;
  document.getElementById('contact-modal').classList.remove('hide');
};
window.fecharModal = function(){
  document.getElementById('contact-modal').classList.add('hide');
};
document.addEventListener('keydown',e=>{ if(e.key==='Escape') fecharModal(); });

</script>
</body>
</html>
